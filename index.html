
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Scientific Calculator Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-glow"></div>

<div class="app-container">

  <div class="topbar">
    <h1>AI Scientific Calculator Pro</h1>

    <button id="themeToggle">🌙 Toggle Theme</button>
  </div>

  <div class="main-grid">

    <div class="calculator">

      <div class="display-container">
        <div id="livePreview"></div>
        <input type="text" id="input" placeholder="0">
      </div>

      <div class="buttons">

        <button class="action-btn" id="clear">AC</button>
        <button class="action-btn" id="erase">⌫</button>
        <button class="operator">(</button>
        <button class="operator">)</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">/</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">*</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">-</button>

        <button>0</button>
        <button>.</button>
        <button>%</button>
        <button class="operator">+</button>

        <button class="science-btn" data-value="sin(">sin</button>
        <button class="science-btn" data-value="cos(">cos</button>
        <button class="science-btn" data-value="tan(">tan</button>
        <button class="science-btn" data-value="sqrt(">√</button>

        <button class="science-btn" data-value="log(">log</button>
        <button class="science-btn" data-value="pi">π</button>
        <button class="science-btn" data-value="e">e</button>
        <button class="science-btn" data-value="^">xʸ</button>

        <button class="equal-btn" id="equal">=</button>
      </div>

    </div>

    <div class="sidebar">

      <div class="panel">
        <h2>AI Math Assistant</h2>

        <textarea id="aiInput"
          placeholder="Ask AI math questions...&#10;&#10;Examples:&#10;- Solve 2x + 3 = 11&#10;- Explain Pythagoras theorem&#10;- What is 25% of 450?"></textarea>

        <div class="ai-actions">
          <button id="voiceBtn">🎤 Voice</button>
          <button id="askAI">Ask AI</button>
        </div>

        <div id="aiResponse"></div>

        <p class="api-note">
          Add your OpenAI API key inside script.js to activate AI responses.
        </p>
      </div>

      <div class="panel">
        <h2>Calculation History</h2>
        <ul id="history"></ul>
      </div>

      <div class="panel">
        <h2>Graph Plotter</h2>

        <input type="text"
               id="graphInput"
               placeholder="Example: x^2 + 2*x + 1">

        <button id="plotBtn">Plot Graph</button>

        <div id="graph"></div>
      </div>

    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
